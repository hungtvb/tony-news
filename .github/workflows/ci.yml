name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tony_news_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tony_news_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate benchmark contract
        run: pnpm benchmark:validate -- --json

      - name: Evaluate conservative event relations
        run: pnpm cluster:evaluate -- --json --fail-on-provisional-mismatch

      - name: Verify database migration is reproducible
        shell: bash
        run: |
          pnpm db:generate
          status=$(git status --porcelain -- packages/db/drizzle)
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- packages/db/drizzle
            exit 1
          fi

      - name: PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tony_news_test
        run: pnpm test:integration

      - name: Live RSS smoke
        id: live-rss-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/rss-smoke.ts --json > rss-smoke.json 2>&1
          status=$?
          cat rss-smoke.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload RSS smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-smoke-evidence
          path: rss-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Live article extraction smoke
        id: live-article-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/article-smoke.ts --json > article-smoke.json 2>&1
          status=$?
          cat article-smoke.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload article smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-smoke-evidence
          path: article-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publisher structure diagnostics
        id: publisher-structure-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/article-structure-smoke.ts > article-structure.json 2>&1
          status=$?
          cat article-structure.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload publisher structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-structure-evidence
          path: article-structure.json
          if-no-files-found: warn
          retention-days: 14

      - name: Browser Run markdown comparison
        id: browser-run-smoke
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/browser-run-smoke.ts > browser-run-smoke.json 2>&1
          status=$?
          cat browser-run-smoke.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Browser Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-run-smoke-evidence
          path: browser-run-smoke.json
          if-no-files-found: warn
          retention-days: 14
