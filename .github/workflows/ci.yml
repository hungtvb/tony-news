name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generate database migration
        run: pnpm db:generate

      - name: Commit generated migration on persistence branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/persistence-schema-idempotency'
        shell: bash
        run: |
          git add packages/db/drizzle
          if git diff --cached --quiet; then
            echo "Migration already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit generated initial PostgreSQL migration"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload generated database migration
        uses: actions/upload-artifact@v4
        with:
          name: generated-db-migration
          path: packages/db/drizzle
          if-no-files-found: error
          retention-days: 14

      - name: Live RSS smoke
        id: live-rss-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/rss-smoke.ts --json > rss-smoke.json 2>&1
          status=$?
          cat rss-smoke.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload RSS smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-smoke-evidence
          path: rss-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Live article extraction smoke
        id: live-article-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/article-smoke.ts --json > article-smoke.json 2>&1
          status=$?
          cat article-smoke.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload article smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-smoke-evidence
          path: article-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publisher structure diagnostics
        id: publisher-structure-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/article-structure-smoke.ts > article-structure.json 2>&1
          status=$?
          cat article-structure.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload publisher structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-structure-evidence
          path: article-structure.json
          if-no-files-found: warn
          retention-days: 14

      - name: Browser Run markdown comparison
        id: browser-run-smoke
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node --experimental-strip-types apps/worker/src/browser-run-smoke.ts > browser-run-smoke.json 2>&1
          status=$?
          cat browser-run-smoke.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Browser Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-run-smoke-evidence
          path: browser-run-smoke.json
          if-no-files-found: warn
          retention-days: 14
